name: Build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A newer push to the same branch or PR cancels the build that is still running.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25
          cache: maven
      # Compiles every module, builds the CSS and runs all tests, including the module boundary check.
      # Testcontainers uses the Docker that GitHub's Ubuntu runners come with.
      - name: Build and test
        run: ./mvnw -B verify
