<!DOCTYPE html>

<html lang="en" xmlns:th="http://www.thymeleaf.org" th:fragment="page(title, content)">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:replace="${title}">Job Tracker</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
    <script th:src="@{/webjars/htmx.org/dist/htmx.min.js}" defer></script>
</head>

<body class="min-h-screen bg-gray-50 text-gray-900">
<header class="border-b border-gray-200 bg-white">
    <nav class="mx-auto flex max-w-5xl items-center gap-6 px-4 py-3">
        <a class="font-semibold" th:href="@{/applications}">Job Tracker</a>
        <a class="text-gray-600 hover:text-gray-900" th:href="@{/applications}">Applications</a>
        <a class="text-gray-600 hover:text-gray-900" th:href="@{/search}">Search</a>
        <a class="ml-auto text-gray-600 hover:text-gray-900" th:href="@{/profiles}">Profiles</a>
    </nav>
</header>

<div class="mx-auto max-w-5xl px-4 py-8">
    <main th:replace="${content}"></main>
</div>

</body>
</html>
