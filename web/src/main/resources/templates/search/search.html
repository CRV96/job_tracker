<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: page(~{::title}, ~{::main})}">
<head>
    <title th:text="|#{search.title} · JobWarden|">Search · JobWarden</title>
</head>
<body>
<main>
    <h1 class="text-2xl font-semibold" th:text="#{search.heading}">Boolean search generator</h1>
    <p class="mt-2 text-gray-500" th:text="#{search.intro}">Separate alternatives with commas. Paste the result into Google or LinkedIn.</p>

    <form class="mt-6 grid max-w-xl gap-3" th:hx-post="@{/search}" hx-target="#results" hx-swap="outerHTML">
        <input class="rounded border px-3 py-2" type="text" name="jobTitles" th:placeholder="#{search.jobTitles.placeholder}">
        <input class="rounded border px-3 py-2" type="text" name="keywords" th:placeholder="#{search.keywords.placeholder}">
        <input class="rounded border px-3 py-2" type="text" name="excludedKeywords" th:placeholder="#{search.excluded.placeholder}">
        <input class="rounded border px-3 py-2" type="text" name="locations" th:placeholder="#{search.locations.placeholder}">
        <button class="justify-self-start rounded bg-gray-900 px-4 py-2 text-white" type="submit" th:text="#{search.generate}">Generate</button>
    </form>

    <div id="results" class="mt-8" th:fragment="results">
        <!--/* TODO: one block per generated query: the target name, the query text and a copy button */-->
    </div>
</main>
</body>
</html>
