name: job-tracker

services:
  postgres:
    image: 'postgres:18-alpine'
    environment:
      - 'POSTGRES_DB=jobtracker'
      - 'POSTGRES_USER=jobtracker'
      - 'POSTGRES_PASSWORD=jobtracker'
    ports:
      - '5432'
    volumes:
      - 'postgres-data:/var/lib/postgresql'

volumes:
  postgres-data:
