<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: page(~{::title}, ~{::main})}">
<head>
    <title>Search · Job Tracker</title>
</head>
<body>
<main>
    <h1 class="text-2xl font-semibold">Boolean search generator</h1>
    <p class="mt-2 text-gray-500">Separate alternatives with commas. Paste the result into Google or LinkedIn.</p>

    <form class="mt-6 grid max-w-xl gap-3" th:hx-post="@{/search}" hx-target="#results" hx-swap="outerHTML">
        <input class="rounded border px-3 py-2" type="text" name="jobTitles" placeholder="Job titles, e.g. Java Developer, Backend Engineer">
        <input class="rounded border px-3 py-2" type="text" name="keywords" placeholder="Keywords, e.g. Spring, Kafka">
        <input class="rounded border px-3 py-2" type="text" name="excludedKeywords" placeholder="Exclude, e.g. junior, intern">
        <input class="rounded border px-3 py-2" type="text" name="locations" placeholder="Locations, e.g. Remote, Bucharest">
        <button class="justify-self-start rounded bg-gray-900 px-4 py-2 text-white" type="submit">Generate</button>
    </form>

    <div id="results" class="mt-8" th:fragment="results">
        <!--/* TODO: one block per generated query: the target name, the query text and a copy button */-->
    </div>
</main>
</body>
</html>
