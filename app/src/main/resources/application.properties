spring.application.name=job_tracker

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Where the browser extension posts the job postings it captures. Change it here and in the extension together.
jobtracker.capture.path=/api/captures

# The selected profile lives in the HTTP session: keep it for a week instead of Tomcat's 30 minutes. The session
# cookie goes along with the app's own pages and links into it, but not with forms other sites submit to it.
server.servlet.session.timeout=7d
server.servlet.session.cookie.same-site=lax

# The app logs what changes at INFO. Reads, rejected forms and captures are logged at DEBUG; to see them, uncomment:
#logging.level.com.jobtracker=DEBUG
