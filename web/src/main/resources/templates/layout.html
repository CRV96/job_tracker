<!DOCTYPE html>

<html lang="en" th:lang="${#locale.language}" xmlns:th="http://www.thymeleaf.org" th:fragment="page(title, content)">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:replace="${title}">JobWarden</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
    <!--/* By default HTMX doesn't send a form with an invalid field, and doesn't say why either. */-->
    <meta name="htmx-config" content='{"reportValidityOfForms": true}'>
    <script th:src="@{/webjars/htmx.org/dist/htmx.min.js}" defer></script>
</head>

<body class="min-h-screen bg-gray-50 text-gray-900">
<header class="border-b border-gray-200 bg-white">
    <nav class="mx-auto flex max-w-5xl items-center gap-6 px-4 py-3">
        <a class="font-semibold" th:href="@{/applications}">JobWarden</a>
        <a class="text-gray-600 hover:text-gray-900" th:href="@{/applications}" th:text="#{nav.applications}">Applications</a>
        <a class="text-gray-600 hover:text-gray-900" th:href="@{/search}" th:text="#{nav.search}">Search</a>

        <!--/* Reloads the current page with ?lang=, which LocaleConfiguration remembers in a cookie. A GET form without an
               action goes to the current address, so the page stays the same (its own query parameters are dropped). */-->
        <form class="ml-auto" method="get" th:if="${languages}">
            <select class="rounded border border-gray-300 bg-white px-2 py-1 text-sm" name="lang"
                    th:aria-label="#{language.label}" onchange="this.form.submit()">
                <option th:each="language : ${languages}" th:value="${language.tag}" th:text="${language.nativeName}"
                        th:selected="${language.tag == #locale.language}">English</option>
            </select>
            <noscript><button class="text-sm underline" type="submit" th:text="#{language.change}">Change</button></noscript>
        </form>

        <!--/* Pages that know the selected profile put it in the model as currentProfile. */-->
        <a class="text-gray-600 hover:text-gray-900" th:href="@{/profiles}">
            <th:block th:if="${currentProfile}"><span class="font-medium text-gray-900" th:text="${currentProfile.name}">Robert</span>
                · <th:block th:text="#{nav.switchProfile}">Switch profile</th:block></th:block>
            <th:block th:unless="${currentProfile}" th:text="#{nav.profiles}">Profiles</th:block>
        </a>
    </nav>
</header>

<!--/* HTMX ignores error responses, so a failed click would otherwise do nothing, e.g. when the application was
       deleted in another tab or the server is down. The script at the end shows this instead. */-->
<div id="request-error" class="border-b border-red-200 bg-red-50" role="alert" hidden>
    <p class="mx-auto max-w-5xl px-4 py-2 text-sm text-red-800">
        <th:block th:text="#{requestError.message}">That didn’t work.</th:block>
        <a class="underline" href="" th:text="#{requestError.reload}">Reload the page and try again.</a>
    </p>
</div>

<div class="mx-auto max-w-5xl px-4 py-8">
    <main th:replace="${content}"></main>
</div>

<script>
    for (const failure of ['htmx:responseError', 'htmx:sendError']) {
        document.addEventListener(failure, () => document.getElementById('request-error').hidden = false);
    }
</script>

</body>
</html>
